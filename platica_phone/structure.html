<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plática Phone Structure</title>
</head>
<body>
<script>
/*
  PLÁTICA PHONE STRUCTURE - 12 + GAP + 10 FRAME PLAN

  This file belongs inside the platica_phone folder.
  It does NOT open a phone lessonselect page.

  The main-path lessonselect.html chooses the lesson first and stores it in
  sessionStorage. This phone structure file preserves that lesson choice,
  prepares the phone-frame plan, then opens director.html in the same folder.

  New phone layout plan:
    - 12 upper pronoun/person/expression frames: 4 rows of 3
    - separator gap
    - 10 lower object frames: 3-4-3
*/
(function () {
  const storedLesson =
    sessionStorage.getItem("selectedLesson") ||
    sessionStorage.getItem("lesson") ||
    sessionStorage.getItem("currentLesson") ||
    "1";

  const n = Number(storedLesson);
  const lessonToUse = Number.isFinite(n) && n > 0 ? String(n) : "1";

  sessionStorage.setItem("lesson", lessonToUse);
  sessionStorage.setItem("selectedLesson", lessonToUse);
  sessionStorage.setItem("currentLesson", lessonToUse);

  // 12 upper frames: p11 through p22.
  const pronounSlots = [];
  for (let id = 11; id <= 22; id++) {
    pronounSlots.push({ id: id, kind: "main" });
  }

  // 10 lower object frames: p1 through p10.
  const objectSlots = [];
  for (let id = 1; id <= 10; id++) {
    objectSlots.push({ id: id });
  }

  // Row-by-row layout plan for a director that respects row definitions.
  // The gap row is intentional and should be rendered as vertical space,
  // not as an image frame.
  const phoneLayoutRows = [
    { group: "pronouns", columns: 3, ids: [11, 12, 13] },
    { group: "pronouns", columns: 3, ids: [14, 15, 16] },
    { group: "pronouns", columns: 3, ids: [17, 18, 19] },
    { group: "pronouns", columns: 3, ids: [20, 21, 22] },

    { group: "gap", columns: 0, ids: [], height: "separator" },

    { group: "objects", columns: 3, ids: [1, 2, 3] },
    { group: "objects", columns: 4, ids: [4, 5, 6, 7] },
    { group: "objects", columns: 3, ids: [8, 9, 10] }
  ];

  const combinedSlots = [];
  phoneLayoutRows.forEach(row => {
    if (row.group === "gap") {
      combinedSlots.push({ group: "gap", kind: "separator" });
      return;
    }

    row.ids.forEach(id => {
      combinedSlots.push({
        group: row.group,
        id: id,
        kind: row.group === "pronouns" ? "main" : "object",
        rowColumns: row.columns
      });
    });
  });

  sessionStorage.setItem("pronounSlots", JSON.stringify(pronounSlots));
  sessionStorage.setItem("objectSlots", JSON.stringify(objectSlots));
  sessionStorage.setItem("phoneLayoutRows", JSON.stringify(phoneLayoutRows));
  sessionStorage.setItem("combinedPhoneSlots", JSON.stringify(combinedSlots));

  // In this 12-frame upper plan, p21 and p22 remain expression-style frames.
  sessionStorage.setItem("expressionPronounIds", JSON.stringify([21, 22]));

  if (!sessionStorage.getItem("tense")) {
    sessionStorage.setItem("tense", "now");
  }

  // Correct phone path: same folder, phone director.
  window.location.replace("director.html");
})();
</script>
</body>
</html>
