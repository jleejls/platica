<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plática Phone Structure</title>
</head>
<body>
<script>
/*
  PLÁTICA PHONE STRUCTURE - 9 + 2 CIRCLES + GAP + 10 FRAME PLAN

  Put this file inside:
    platica_phone/structure.html

  Layout prepared for the phone director:
    - p11-p19: 9 upper pronoun/person square frames, 3 rows of 3
    - p20-p21: 2 centered circular expression frames
    - separator gap
    - p1-p10: 10 lower object frames, 3-4-3
*/
(function () {
  const storedLesson =
    sessionStorage.getItem("selectedLesson") ||
    sessionStorage.getItem("lesson") ||
    sessionStorage.getItem("currentLesson") ||
    "1";

  const n = Number(storedLesson);
  const lessonToUse = Number.isFinite(n) && n > 0 ? String(n) : "1";

  sessionStorage.setItem("lesson", lessonToUse);
  sessionStorage.setItem("selectedLesson", lessonToUse);
  sessionStorage.setItem("currentLesson", lessonToUse);

  const phoneLayoutRows = [
    { group: "pronouns", columns: 3, ids: [11, 12, 13] },
    { group: "pronouns", columns: 3, ids: [14, 15, 16] },
    { group: "pronouns", columns: 3, ids: [17, 18, 19] },

    { group: "expressions", columns: 2, ids: [20, 21], shape: "circle" },

    { group: "gap", columns: 0, ids: [], height: "separator" },

    { group: "objects", columns: 3, ids: [1, 2, 3] },
    { group: "objects", columns: 4, ids: [4, 5, 6, 7] },
    { group: "objects", columns: 3, ids: [8, 9, 10] }
  ];

  const pronounSlots = [];
  for (let id = 11; id <= 19; id++) {
    pronounSlots.push({ id: id, kind: "main", shape: "square" });
  }

  const expressionSlots = [
    { id: 20, kind: "expression", shape: "circle" },
    { id: 21, kind: "expression", shape: "circle" }
  ];

  const objectSlots = [];
  for (let id = 1; id <= 10; id++) {
    objectSlots.push({ id: id, kind: "object", shape: "square" });
  }

  const combinedSlots = [];
  phoneLayoutRows.forEach(row => {
    if (row.group === "gap") {
      combinedSlots.push({ group: "gap", kind: "separator" });
      return;
    }

    row.ids.forEach(id => {
      combinedSlots.push({
        group: row.group,
        id: id,
        kind: row.group === "expressions" ? "expression" :
              row.group === "objects" ? "object" : "main",
        shape: row.shape || "square",
        rowColumns: row.columns
      });
    });
  });

  sessionStorage.setItem("phoneLayoutRows", JSON.stringify(phoneLayoutRows));
  sessionStorage.setItem("pronounSlots", JSON.stringify(pronounSlots));
  sessionStorage.setItem("expressionSlots", JSON.stringify(expressionSlots));
  sessionStorage.setItem("objectSlots", JSON.stringify(objectSlots));
  sessionStorage.setItem("combinedPhoneSlots", JSON.stringify(combinedSlots));
  sessionStorage.setItem("expressionPronounIds", JSON.stringify([20, 21]));

  if (!sessionStorage.getItem("tense")) {
    sessionStorage.setItem("tense", "now");
  }

  // Tell the main non-modular director to use the phone layout from sessionStorage.
  sessionStorage.setItem("phoneMode", "1");

  // Return to the main director after this structure file has prepared the phone layout.
  window.location.replace("../director.html?phoneRun=1");
})();
</script>
</body>
</html>
